[[audit]]
action = "jdx/mise-action"
sha = "b44d12e7d0d8ee7461bb893e1b1993500433185b"
version = "v5.2.7"
who = "Waffuru AI, Inc. <security@waffuru.ai>"
date = 2026-11-17
notes = "Bump from v5.2.4 (6be3c7ed), through v5.2.5 and v5.2.6. Compare 6be3c7ed...b44d12e7, 14 commits; action.yml unchanged. src read in full: #718 exits the process once run or post settles (5 s output flush), so a failed cache restore can't hold the step; #722 moves downloads to src/download-retry.ts, capped exponential backoff with jitter retrying only transport errors, 408, 429 and 5xx, curl -sSL with the status from --write-out and wget --tries=1, partial files removed, stderr no longer logged; the checksum, minisign and packslip verification paths are unchanged. package.json: packslip 1.8.0 to 1.11.2, @types/node (dev). The dist/index.js diff (2626 lines) was read: those changes, and bundled packages moving within the same set (dist/licenses.txt, no package added or removed): packslip 1.11.2 (identity and project-signer checks, bundle size limits), checked line by line against the npm tarball (integrity matches the registry, gitHead b934a22b, the packslip v1.11.2 tag) with only bundler renames between them; sigstore 5.0.1, @sigstore/sign 5.1.0 (a Buildkite OIDC provider that runs buildkite-agent only when BUILDKITE=true, signing only), @sigstore/verify 4.1.3 (tlog checkpoint bound to its log ID), @sigstore/tuf 5.0.1 whose seeded root.json moves from v15 to v16, each byte-identical to tuf-repo-cdn.sigstore.dev 15.root.json and 16.root.json; tuf-js 6.0.2 and @tufjs/models 5.0.2 (P-384 and RSA-PSS key schemes, duplicate delegation and cached-delegate checks); semver 7.8.6, fast-xml-parser 5.12.0, is-unsafe 2.0.3, ip-address 10.7.6. The bundle was not rebuilt. The rest is workflow and tool bumps, the lock files and README. Release published 2026-11-06, tag is the pinned commit."

