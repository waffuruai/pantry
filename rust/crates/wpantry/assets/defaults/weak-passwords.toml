# Known-weak passwords (any case). A hardcoded password, passwd, pwd or secret
# assignment whose value matches one fails or warns as SUSPECT-WEAK-PASSWORD,
# by list. Before matching, trailing digits and symbols are stripped and
# common leet substitutions undone (p@ssw0rd is password, Admin1 is admin), so
# simple mutations still match. Any other non-empty quoted password literal
# warns. A small curated list of the most common weak and default passwords,
# not a cracking dictionary.
#   fail  defaults, placeholders left in, and structureless credentials: a
#         shipped default or a committed throwaway is almost never a real
#         secret someone meant to keep
#   warn  common dictionary and pop-culture passwords: genuinely weak, but
#         more likely a real (bad) password than a shipped default

fail = [
  "password",
  "password1",
  "password123",
  "passw0rd",
  "123456",
  "1234567",
  "12345678",
  "123456789",
  "1234567890",
  "12345",
