# Development toolchain, pinned, and the tasks that use it. `mise bootstrap` installs all of it
# (checksummed through mise's aqua registry) and runs the `bootstrap` task; `mise run test` runs the
# suites; `mise tasks ls` lists the rest. CI installs the same pins with jdx/mise-action and runs the
# same tasks. Rust comes from rustup, at the toolchain rust/rust-toolchain.toml pins. wpantry itself
# needs only gitleaks, git and openssl, so this file is for contributors and CI, not users. Keep the
# pins equal to ops' mise.toml. See ops planning/specs/02-mise-bootstrap.md.
[tools]
node = "26.12.1"  # offline HTML viewer behavior tests (no npm dependencies)
python = "3.15.1"   # the CLI contract suite (tests/contract) and scripts/
gitleaks = "8.30.1" # wpantry's secret scan
shellcheck = "0.11.0"
actionlint = "1.7.12"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1" # the coverage gate (mise run coverage)

# A global mise rust sets RUSTUP_TOOLCHAIN, which would win over rust/rust-toolchain.toml.
[tasks.build]
description = "Build wpantry (rust/target/release/wpantry) on the toolchain rust/rust-toolchain.toml pins"
dir = "rust"
run = "env -u RUSTUP_TOOLCHAIN cargo build --locked --release"

[tasks.bootstrap]
description = "Setup after mise installs [tools]: build wpantry and confirm it finds what it needs (wpantry tools)"
depends = ["build"]
run = "rust/target/release/wpantry tools"

[tasks.test]
description = "Test suites; `all` (the default) is the Rust tests, the CA trust test, the install.sh test, the scripts/ tests, the HTML viewer tests and the Homebrew packaging tests"
usage = '''
arg "[suite]" default="all" help="all, rust, ca-trust, install, scripts, html or packaging" {
  choices "all" "rust" "ca-trust" "install" "scripts" "html" "packaging"
}
'''
run = '''
cargo_test() { (cd rust && env -u RUSTUP_TOOLCHAIN cargo test --locked); }
scripts_test() { python3 -m unittest discover -s scripts; }
packaging_test() { tests/packaging/test-bump.sh && tests/packaging/test-tap-pr.sh; }
case "${usage_suite:-all}" in
  all) cargo_test && ca-trust/test-ca-trust.sh && tests/install/test-install.sh && scripts_test && node tests/html/test-viewer.cjs && packaging_test ;;
  html) node tests/html/test-viewer.cjs ;;
  rust) cargo_test ;;
  ca-trust) exec ca-trust/test-ca-trust.sh ;;
  install) exec tests/install/test-install.sh ;;
  scripts) scripts_test ;;
  packaging) packaging_test ;;
esac
'''

[tasks.coverage]
description = "Line coverage of the Rust tests and the contract suite together (cargo-llvm-cov); fails under 90%. --html also writes rust/target/llvm-cov/html"
usage = '''
flag "--html" help="Also write the HTML report, to rust/target/llvm-cov/html"
'''
dir = "rust"
run = '''
set -e
# The global mise rust sets RUSTUP_TOOLCHAIN, which would win over rust-toolchain.toml;
# the pinned cargo-llvm-cov goes ahead of any `cargo install`ed one on PATH.
unset RUSTUP_TOOLCHAIN
PATH="$(mise where aqua:taiki-e/cargo-llvm-cov):$PATH"; export PATH
rustup component add llvm-tools
# One instrumented build (show-env) serves both suites: the Rust tests, then the
# contract suite against the instrumented debug binary. The report counts both.
eval "$(cargo llvm-cov show-env --sh)"
cargo llvm-cov clean --workspace
cargo test --locked --workspace --all-targets
cargo build --locked
(cd .. && WPANTRY=rust/target/debug/wpantry python3 -m unittest discover -s tests/contract)
if [ "${usage_html:-false}" = true ]; then cargo llvm-cov report --html; fi
cargo llvm-cov report --fail-under-lines 90
'''

[tasks.vet]
description = "Dependency audits; `all` (the default) is the actions record check (scripts/vet_actions.py) and cargo vet with cargo deny in rust/"
usage = '''
arg "[what]" default="all" help="all, actions or crates" {
  choices "all" "actions" "crates"
}
'''
run = '''
actions_vet() { python3 scripts/vet_actions.py; }
crates_vet() { (cd rust && env -u RUSTUP_TOOLCHAIN cargo vet --locked && env -u RUSTUP_TOOLCHAIN cargo deny --locked check); }
case "${usage_what:-all}" in
  all) actions_vet && crates_vet ;;
  actions) actions_vet ;;
  crates) crates_vet ;;
esac
'''

[tasks.contract]
description = "The CLI contract suite against WPANTRY (default rust/target/release/wpantry, built first)"
depends = ["build"]
env = { WPANTRY = "{{ env.WPANTRY | default(value='rust/target/release/wpantry') }}" }
run = "python3 -m unittest discover -s tests/contract"

[tasks.lint]
description = "bash -n and shellcheck -x on the shell scripts, actionlint on the workflows"
run = [
  'for f in ca-trust/*.sh rust/release/*.sh install.sh tests/install/*.sh packaging/homebrew/*.sh tests/packaging/*.sh; do bash -n "$f"; done',
  # -x follows `source ca-common.sh`; .shellcheckrc resolves it relative to each script.
  "shellcheck -x ca-trust/*.sh rust/release/*.sh install.sh tests/install/*.sh packaging/homebrew/*.sh tests/packaging/*.sh",
  "actionlint",
]

[tasks.scan]
description = "Run wpantry scan, built first, with the pinned tools; more flags after --, such as -- --json --no-input"
alias = "check"
usage = 'arg "[args]" var=#true help="wpantry scan flags"'
depends = ["build"]
run = '''
eval "set -- ${usage_args:-}"
exec rust/target/release/wpantry scan "$@"
'''
