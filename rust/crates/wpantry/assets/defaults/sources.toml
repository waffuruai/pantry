# Every outside source wpantry reads (specs/design/sources-file.md). The
# hosts here are the only ones wpantry connects to: `net::HOSTS` is
# compiled from this file's, and a test fails when they disagree.
#
#   id            unique, kebab-case: names the source in findings and `wpantry sources`
#   kind          what it gives: advisories | kev | exploit-prediction | eol | releases | malicious-packages
#                 | licenses | breaches | yara | hashes | hosts | filenames | hash-lookup
#   format        how it is read
#   url           the file, or the API's base; `{}` marks where a request puts its part
#   transport     https (the default, through the host allowlist) or git (cloned or listed by git)
#   redirects     other hosts the source sends its downloads to
#   tier          default | deep | off
#   refresh       how stale a copy may be before it is fetched again
#   license       the data's licence, as far as known ("unspecified" otherwise)
#   redistribute  whether it may be put in a bundle wpantry ships (never, unless true)
#   max_bytes     the most of one answer read
#   sends         what a lookup sends about this machine (`sha256` is the only value a user source may use)
#   consent       the consent it is asked under, once

[[source]]
id = "osv"
kind = "advisories"
format = "osv-api"
url = "https://api.osv.dev/v1"
tier = "default"
refresh = "1d"
license = "CC-BY-4.0 (varies by advisory source)"
redistribute = false
max_bytes = 134217728
sends = "package"

