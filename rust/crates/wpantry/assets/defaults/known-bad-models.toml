# Known-bad AI models: Pantry's default list, matched offline against the
# model files a scan reads. Each list's level is fixed:
#   repos   fail  a Hugging Face repo id (org/name) that published a malicious
#                 model, a malicious file or a poisoned chat template; matched
#                 without regard to case, also when Ollama pulled it (hf.co/...)
#   sha256  fail  a model file's SHA-256, matched where the store's layout gives
#                 it (a Hugging Face hub cache blob, an Ollama blob): no file is
#                 hashed
#   ollama  fail  an Ollama model (namespace/model), any tag
#   owners  warn  an account that published confirmed malicious models: any
#                 other repo of theirs is worth a look; the file itself isn't
#                 known to be bad
#   demos   warn  a public proof of concept or deliberately backdoored model,
#                 published to demonstrate an attack
#
# Removed repos stay listed: people still have them cached. Rows are grouped
# under the source(s) they come from and sorted within a group; a repo is in
# one list only (malicious wins over demo). Add a row to add an entry; no
# code changes.

