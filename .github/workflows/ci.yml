name: CI

# The Python scanner's offline tests on the oldest (3.9, what a fresh Mac
# has) and a current Python, on Linux and macOS, plus shell and workflow lint.
on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

env:
  # Tasks run with the tools mise-action installed and nothing more.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The 3.9 leg tests the interpreter users have: macOS's own
      # /usr/bin/python3 is 3.9, and Linux gets 3.9 from setup-python. The
      # 3.15 leg tests the python pinned in mise.toml.
      - if: ${{ matrix.python == '3.9' && runner.os != 'macOS' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: ${{ matrix.python == '3.15' }}
          install_args: python
          cache: true

      # Tasks see only mise's tool directories and the base system, so a tool
      # missing from mise.toml fails here; the 3.9 interpreter is named
      # explicitly through WSCANNER_PYTHON.
      - name: Pick the Python under test and cut PATH
        env:
          WANT: ${{ matrix.python }}
        run: |
          case "$WANT/$RUNNER_OS" in
            3.9/macOS) py=/usr/bin/python3 ;;
            3.9/*) py="$(command -v python)" ;;
            *) py="$(mise which python3)" ;;
          esac
          "$py" -c 'import sys, os; v = os.environ["WANT"]; assert "%d.%d" % sys.version_info[:2] == v, sys.version'
          echo "WSCANNER_PYTHON=$py" >> "$GITHUB_ENV"
          echo "TASK_PATH=$(dirname "$(command -v mise)"):/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_ENV"

      - name: unittest
        run: PATH="$TASK_PATH" mise run test unit

      - name: CA trust test
        if: ${{ matrix.python == '3.15' }}
        run: PATH="$TASK_PATH" mise run test ca-trust

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same pins laptops use: shellcheck and actionlint from mise.toml,
      # fetched through mise's checksummed registry. Python is not needed here.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: shellcheck actionlint
          cache: true

      - name: Cut PATH to mise and the base system
        run: echo "TASK_PATH=$(dirname "$(command -v mise)"):/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_ENV"

      - name: mise tasks validate
        run: PATH="$TASK_PATH" mise tasks validate

      # bash -n, shellcheck -x (actionlint also lints every `run:` block with it)
      # and actionlint.
      - name: lint
        run: PATH="$TASK_PATH" mise run lint
