name: Release

# Reproducible, signed releases for every target; the playbook is
# docs/internal/release.md. A tag vX.Y.Z on main builds every target twice,
# from two checkouts at different paths, and requires byte-identical binaries;
# then it publishes them with SHA256SUMS, a GitHub artifact attestation and a
# cosign keyless bundle each, and publishes the crates to crates.io through
# trusted publishing (no long-lived token). A manual run is a dry run of a
# ref: the same checks and builds, the binaries kept as workflow artifacts,
# and nothing published.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to dry-run (nothing is published)"
        required: true
        default: dev

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REF: ${{ inputs.ref || github.ref }}

jobs:
  # The tag names the workspace version and sits on main; the crates package
  # and verify from their own sources.
  check:
    name: Check the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Tag, version and branch agree
        if: github.event_name == 'push'
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' rust/Cargo.toml | head -1)"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME but rust/Cargo.toml says $version"; exit 1; }
          # fetch-depth: 0 already fetched origin/main; a fetch here would need
          # the credentials persist-credentials: false dropped.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Desktop and scanner versions agree
        run: |
          scanner="$(sed -n 's/^version = "\(.*\)"$/\1/p' rust/Cargo.toml | head -1)"
          desktop="$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/Cargo.toml | head -1)"
          [ "$scanner" = "$desktop" ] || { echo "::error::desktop version $desktop differs from scanner $scanner"; exit 1; }
          cmp rust/rust-toolchain.toml desktop/rust-toolchain.toml

      - name: Install the pinned toolchain
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Desktop licence notices
        working-directory: desktop
        run: |
          cargo install --locked cargo-about@0.9.3
          cargo about generate --locked --fail -c release/about.toml release/about.hbs > PANTRY-DESKTOP-NOTICES.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-notices
          path: desktop/PANTRY-DESKTOP-NOTICES.txt
          if-no-files-found: error

      - name: cargo package
        working-directory: rust
        run: cargo package --locked --workspace

  build:
    name: Build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, rust: "x86_64-unknown-linux-musl x86_64-unknown-linux-gnu", desktop: x86_64-unknown-linux-gnu, setup_ext: .tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, rust: "aarch64-unknown-linux-musl aarch64-unknown-linux-gnu", desktop: aarch64-unknown-linux-gnu, setup_ext: .tar.gz }
          - { os: macos-latest, target: universal-apple-darwin, rust: "aarch64-apple-darwin x86_64-apple-darwin", setup_ext: .zip }
          # Windows (#11): repo checks only; the asset keeps its .exe so it runs
          # when downloaded. Git Bash runs build.sh.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, rust: x86_64-pc-windows-msvc, ext: .exe, setup_ext: .exe, python: python }
    env:
      TARGET: ${{ matrix.target }}
      RUST_TARGETS: ${{ matrix.rust }}
      ASSET: wpantry-${{ matrix.target }}${{ matrix.ext }}
      DESKTOP_PYTHON: ${{ matrix.python || 'python3' }}
      DESKTOP_TARGET: ${{ matrix.desktop || matrix.target }}
      DESKTOP_ASSET: wpantry-desktop-${{ matrix.desktop || matrix.target }}.zip
      SETUP_ASSET: wpantry-setup-${{ matrix.desktop || matrix.target }}${{ matrix.setup_ext }}
      # "true" or "false" only: the certificates themselves reach just the
      # signing steps below, never the build steps and their build scripts.
      HAS_APPLE_CERT: ${{ secrets.APPLE_DEVELOPER_ID_P12 != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_SIGNING_PFX != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          path: one
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          path: two/elsewhere
          persist-credentials: false

      - name: musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - name: Install the pinned toolchain and targets
        working-directory: one/rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          # shellcheck disable=SC2086 # RUST_TARGETS is a list
          rustup target add $RUST_TARGETS

      - name: Build twice
        run: |
          mkdir -p dist
          one/rust/release/build.sh "$TARGET" "dist/$ASSET"
          two/elsewhere/rust/release/build.sh "$TARGET" "second-build${{ matrix.ext }}"
          cmp "dist/$ASSET" "second-build${{ matrix.ext }}" || { echo "::error::two builds of one commit differ"; exit 1; }
          # macOS has shasum, Git Bash on Windows only sha256sum.
          if command -v sha256sum >/dev/null; then sha256sum "dist/$ASSET" "second-build${{ matrix.ext }}"; else shasum -a 256 "dist/$ASSET" "second-build${{ matrix.ext }}"; fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-notices
          path: notices

      - name: Build and package desktop twice
        run: |
          one/rust/release/build.sh "$DESKTOP_TARGET" "desktop-one${{ matrix.ext }}" wpantry-desktop
          two/elsewhere/rust/release/build.sh "$DESKTOP_TARGET" "desktop-two${{ matrix.ext }}" wpantry-desktop
          "$DESKTOP_PYTHON" one/desktop/release/package.py "$DESKTOP_TARGET" "desktop-one${{ matrix.ext }}" "dist/$ASSET" notices/PANTRY-DESKTOP-NOTICES.txt "dist/$DESKTOP_ASSET"
          "$DESKTOP_PYTHON" two/elsewhere/desktop/release/package.py "$DESKTOP_TARGET" "desktop-two${{ matrix.ext }}" "second-build${{ matrix.ext }}" notices/PANTRY-DESKTOP-NOTICES.txt second-desktop.zip
          cmp "dist/$DESKTOP_ASSET" second-desktop.zip || { echo "::error::the two desktop bundles differ"; exit 1; }

      - name: Test the packaged desktop and its scanner
        run: '"$DESKTOP_PYTHON" one/desktop/tests/e2e.py --bundle "dist/$DESKTOP_ASSET"'

      - name: Build, compare and test Pantry Setup
        run: |
          "$DESKTOP_PYTHON" one/desktop/release/setup.py payload "dist/$DESKTOP_ASSET" setup-payload.zlib
          if [ "$RUNNER_OS" != macOS ]; then
            if [ "$RUNNER_OS" = Windows ]; then
              PANTRY_SETUP_PAYLOAD=$(cygpath -w "$PWD/setup-payload.zlib")
            else
              PANTRY_SETUP_PAYLOAD="$PWD/setup-payload.zlib"
            fi
            export PANTRY_SETUP_PAYLOAD
          fi
          one/rust/release/build.sh "$DESKTOP_TARGET" "setup-one${{ matrix.ext }}" wpantry-setup
          two/elsewhere/rust/release/build.sh "$DESKTOP_TARGET" "setup-two${{ matrix.ext }}" wpantry-setup
          "$DESKTOP_PYTHON" one/desktop/release/setup.py bundle "$DESKTOP_TARGET" "setup-one${{ matrix.ext }}" setup-payload.zlib "dist/$SETUP_ASSET"
          "$DESKTOP_PYTHON" two/elsewhere/desktop/release/setup.py bundle "$DESKTOP_TARGET" "setup-two${{ matrix.ext }}" setup-payload.zlib "second-$SETUP_ASSET"
          cmp "dist/$SETUP_ASSET" "second-$SETUP_ASSET"
          "$DESKTOP_PYTHON" one/desktop/tests/e2e.py --setup "dist/$SETUP_ASSET"

      # Signing runs after the byte-for-byte compares above, which cover the
      # unsigned builds. Ad-hoc signatures carry no certificate or timestamp,
      # so the step signs both copies and compares them again. Pantry.app is
      # signed before Setup's payload is rebuilt from it, so Setup installs
      # the signed app. Attestations, cosign bundles and SHA256SUMS are made
      # in the publish job from these uploaded, signed files.
      - name: Ad-hoc sign the app bundles (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT != 'true'
        run: |
          sign=one/desktop/release/sign.py
          python3 "$sign" macos "dist/$DESKTOP_ASSET"
          python3 "$sign" macos second-desktop.zip
          cmp "dist/$DESKTOP_ASSET" second-desktop.zip || { echo "::error::ad-hoc signing of the desktop bundle is not deterministic"; exit 1; }
          python3 one/desktop/release/setup.py payload "dist/$DESKTOP_ASSET" setup-payload.zlib
          python3 one/desktop/release/setup.py bundle "$DESKTOP_TARGET" setup-one setup-payload.zlib "dist/$SETUP_ASSET"
          python3 two/elsewhere/desktop/release/setup.py bundle "$DESKTOP_TARGET" setup-two setup-payload.zlib "second-$SETUP_ASSET"
          python3 "$sign" macos "dist/$SETUP_ASSET"
          python3 "$sign" macos "second-$SETUP_ASSET"
          cmp "dist/$SETUP_ASSET" "second-$SETUP_ASSET" || { echo "::error::ad-hoc signing of Setup is not deterministic"; exit 1; }

      # Off until the secrets exist (docs/internal/release.md, "Code
      # signing"). Developer ID signatures carry a secure timestamp, so
      # signed bytes differ from run to run and are not compared.
      - name: Developer ID sign and notarize (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/pantry-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          trap 'security delete-keychain "$keychain" || true; rm -f "$RUNNER_TEMP/developer-id.p12"' EXIT
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$APPLE_DEVELOPER_ID_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')"
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in APPLE_DEVELOPER_ID_P12"; exit 1; }
          xcrun notarytool store-credentials pantry-notary --keychain "$keychain" \
            --apple-id "$APPLE_NOTARY_APPLE_ID" --team-id "$APPLE_NOTARY_TEAM_ID" --password "$APPLE_NOTARY_PASSWORD"
          sign=(python3 one/desktop/release/sign.py macos --identity "$identity" --keychain "$keychain" --notary-profile pantry-notary)
          "${sign[@]}" "dist/$DESKTOP_ASSET"
          python3 one/desktop/release/setup.py payload "dist/$DESKTOP_ASSET" setup-payload.zlib
          python3 one/desktop/release/setup.py bundle "$DESKTOP_TARGET" setup-one setup-payload.zlib "dist/$SETUP_ASSET"
          "${sign[@]}" "dist/$SETUP_ASSET"

      # Off until the secret exists. Setup embeds its payload when it is
      # compiled, so after signing the desktop executables it is rebuilt
      # from the signed bundle, then signed itself.
      - name: Authenticode sign (Windows)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        env:
          WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          pfx="$RUNNER_TEMP/pantry-signing.pfx"
          printf '%s' "$WINDOWS_SIGNING_PFX" | base64 --decode > "$pfx"
          # shellcheck disable=SC2016 # PowerShell expands $env:, not bash
          thumbprint="$(PFX="$(cygpath -w "$pfx")" powershell.exe -NoProfile -NonInteractive -Command \
            '$p = ConvertTo-SecureString $env:WINDOWS_SIGNING_PASSWORD -AsPlainText -Force; (Import-PfxCertificate -FilePath $env:PFX -CertStoreLocation Cert:\CurrentUser\My -Password $p).Thumbprint' | tr -d '\r')"
          rm -f "$pfx"
          # Take the certificate out of the store however the step ends.
          forget() {
            # shellcheck disable=SC2016 # PowerShell expands $env:, not bash
            THUMB="$thumbprint" powershell.exe -NoProfile -NonInteractive -Command 'Remove-Item (Join-Path Cert:\CurrentUser\My $env:THUMB)'
          }
          trap forget EXIT
          [ -n "$thumbprint" ] || { echo "::error::could not import WINDOWS_SIGNING_PFX"; exit 1; }
          sign=(python one/desktop/release/sign.py windows --thumbprint "$thumbprint")
          "${sign[@]}" "dist/$DESKTOP_ASSET"
          python one/desktop/release/setup.py payload "dist/$DESKTOP_ASSET" setup-payload.zlib
          PANTRY_SETUP_PAYLOAD=$(cygpath -w "$PWD/setup-payload.zlib") one/rust/release/build.sh "$DESKTOP_TARGET" setup-signed.exe wpantry-setup
          python one/desktop/release/setup.py bundle "$DESKTOP_TARGET" setup-signed.exe setup-payload.zlib "dist/$SETUP_ASSET"
          "${sign[@]}" "dist/$SETUP_ASSET"

      - name: Test the signed packages
        if: runner.os == 'macOS' || env.HAS_WINDOWS_CERT == 'true'
        run: |
          "$DESKTOP_PYTHON" one/desktop/tests/e2e.py --bundle "dist/$DESKTOP_ASSET"
          "$DESKTOP_PYTHON" one/desktop/tests/e2e.py --setup "dist/$SETUP_ASSET"

      - name: Smoke test
        if: matrix.target != 'aarch64-unknown-linux-musl' || runner.arch == 'ARM64'
        run: |
          "dist/$ASSET" version --json
          "dist/$ASSET" tools --json > /dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wpantry-${{ matrix.target }}
          path: |
            dist/${{ env.ASSET }}
            dist/${{ env.DESKTOP_ASSET }}
            dist/${{ env.SETUP_ASSET }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Configure the environment with required reviewers: publishing waits for
    # a maintainer's approval (docs/internal/release.md).
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # attestations, cosign keyless signing, crates.io trusted publishing
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wpantry-*
          path: dist
          merge-multiple: true

      # The licence notices every binary embeds (`wpantry licenses`), beside
      # them: install.sh, mise and Homebrew copy only the binary, so the file is
      # for whoever passes the binaries on. CI keeps it current (mise run notices).
      - name: Third-party notices
        run: cp rust/crates/wpantry-cli/THIRD-PARTY-NOTICES.txt dist/THIRD-PARTY-NOTICES.txt

      # dist holds the signed desktop and Setup packages from the build job,
      # so the checksums, attestations and cosign bundles below cover the
      # signed bytes.
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum wpantry-* THIRD-PARTY-NOTICES.txt > SHA256SUMS
          cat SHA256SUMS

      # The installer ships with the release it installs, attested like the
      # binaries: `releases/download/vX.Y.Z/install.sh` can't change later.
      # install.sh.sha256 beside it is what waffuru.ai's release receiver
      # checks before serving a pinned copy at waffuru.ai/pantry/install.sh;
      # without it that deploy fails.
      - name: install.sh
        run: |
          sed "s/^DEFAULT_VERSION=\"latest\"$/DEFAULT_VERSION=\"$GITHUB_REF_NAME\"/" rust/release/install.sh > dist/install.sh
          grep -q "^DEFAULT_VERSION=\"$GITHUB_REF_NAME\"$" dist/install.sh
          chmod 0755 dist/install.sh
          (cd dist && sha256sum install.sh > install.sh.sha256 && cat install.sh.sha256)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/wpantry-*
            dist/install.sh
            dist/THIRD-PARTY-NOTICES.txt

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: cosign keyless bundles
        working-directory: dist
        run: |
          for f in wpantry-*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      # Verify what is about to ship the way users will (docs/public/install.md).
      - name: Verify before publishing
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS install.sh.sha256
          for f in wpantry-*; do
            case "$f" in *.sigstore.json) continue ;; esac
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
            cosign verify-blob "$f" --bundle "$f.sigstore.json" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
          gh attestation verify install.sh --repo "$GITHUB_REPOSITORY"
          gh attestation verify THIRD-PARTY-NOTICES.txt --repo "$GITHUB_REPOSITORY"

      # Releases here are immutable: once published, no asset can be added. So
      # the release starts as a draft and the last job publishes it once the
      # packslip is attached. A rerun adds to the draft instead.
      - name: GitHub release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "wpantry $GITHUB_REF_NAME" --generate-notes ||
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      - name: Install the pinned toolchain
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install

      # crates.io trusted publishing can only be set up for a crate that
      # exists, so a crate's first release is published by hand
      # (docs/internal/crates-io.md). This stays off unless the repository
      # variable CRATES_IO_TRUSTED_PUBLISHING is "true".
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
        id: crates-io

      # Every crate, in dependency order: each depends on the ones before it at =x.y.z.
      - name: Publish to crates.io
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
        run: |
          # --no-verify: the check job already built the packaged crates;
          # building here would run dependency build scripts with this job's
          # OIDC token in reach.
          # Dependencies first: cargo waits for each to appear on crates.io.
          # A crate crates.io doesn't have yet can't trust this workflow, so
          # it's skipped with a warning and published by hand
          # (docs/internal/crates-io.md). A version already there is skipped
          # too, so a rerun goes on from where it stopped.
          version="${GITHUB_REF_NAME#v}"
          for crate in wpantry-yara wpantry wpantry-cli; do
            api="https://crates.io/api/v1/crates/$crate"
            code="$(curl -sS -o /dev/null -w '%{http_code}' -A 'waffuruai/pantry release workflow' "$api")"
            case "$code" in
              200) ;;
              404) echo "::warning::$crate isn't on crates.io yet: publish its $GITHUB_REF_NAME by hand (docs/internal/crates-io.md)"; continue ;;
              *) echo "::error::crates.io answered $code for $crate"; exit 1 ;;
            esac
            code="$(curl -sS -o /dev/null -w '%{http_code}' -A 'waffuruai/pantry release workflow' "$api/$version")"
            case "$code" in
              200) echo "$crate $version is already on crates.io" ;;
              404) cargo publish --locked --no-verify -p "$crate" ;;
              *) echo "::error::crates.io answered $code for $crate $version"; exit 1 ;;
            esac
          done

  # A signed packslip (https://packslip.dev) for the release: the binaries'
  # digests, platforms and executable name, signed keylessly with this
  # workflow's identity. mise installs from it (`mise use
  # packslip:github.com/waffuruai/pantry`) and verifies it, as does
  # `packslip verify`. Signed in a job that can't write the release, as
  # packslip recommends; the next job attaches the bundle and publishes.
  packslip:
    name: Packslip
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # keyless signing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wpantry-*
          path: dist
          merge-multiple: true

      - uses: jdx/packslip@e0340e0c1d10c90a434de2b90f3a1ba345923564 # v1.11.4
        id: packslip
        with:
          artifacts: >-
            dist/wpantry-x86_64-unknown-linux-musl
            dist/wpantry-aarch64-unknown-linux-musl
            dist/wpantry-universal-apple-darwin
            dist/wpantry-x86_64-pc-windows-msvc.exe
          bin: wpantry
          # The publish job attested the binaries; link those attestations.
          attest: link
          upload: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packslip
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  release:
    name: Attach the packslip and publish
    needs: packslip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release asset, and publishing the draft
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packslip
          path: packslip

      - name: Attach the packslip
        run: gh release upload "$GITHUB_REF_NAME" packslip/packslip.sigstore.json --clobber

      # Publishing makes the release immutable, so check nothing is missing:
      # the website's receiver needs install.sh.sha256, and mise the packslip.
      - name: Publish the release
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          for a in SHA256SUMS install.sh install.sh.sha256 packslip.sigstore.json THIRD-PARTY-NOTICES.txt \
            wpantry-x86_64-unknown-linux-musl wpantry-aarch64-unknown-linux-musl wpantry-universal-apple-darwin \
            wpantry-x86_64-pc-windows-msvc.exe \
            wpantry-desktop-x86_64-unknown-linux-gnu.zip wpantry-desktop-aarch64-unknown-linux-gnu.zip \
            wpantry-desktop-universal-apple-darwin.zip wpantry-desktop-x86_64-pc-windows-msvc.zip \
            wpantry-setup-x86_64-unknown-linux-gnu.tar.gz wpantry-setup-aarch64-unknown-linux-gnu.tar.gz \
            wpantry-setup-universal-apple-darwin.zip wpantry-setup-x86_64-pc-windows-msvc.exe; do
            printf '%s\n' "$assets" | grep -qx "$a" || { echo "::error::the draft has no $a"; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      # The website republishes install.sh at https://waffuru.ai/pantry/install.sh.
      # The release is out by now, so a failed dispatch only warns; the next
      # site deploy picks the release up anyway.
      - name: Tell the website about the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::WEBSITE_DISPATCH_TOKEN is unset; the website was not told about $GITHUB_REF_NAME."
            exit 0
          fi
          gh workflow run release.yml --repo waffuruai/website --ref main \
            -f product=pantry -f tag="$GITHUB_REF_NAME"
