[package]
name = "wpantry-desktop"
version = "0.6.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
miniz_oxide = "=0.9.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
codegen-units = 1
