# The GitHub Actions the workflows under .github/workflows/ use, each audited at the
# exact commit it is pinned to: the record `mise run vet actions` checks (scripts/
# vet_actions.py), as rust/supply-chain/audits.toml is for crates. An action not
# recorded here, recorded at another version, or recorded but no longer used fails
# the check; with network the check also verifies that the version's tag is that
# commit and that it is at least 72 hours old. To bump an action: read the compare
# between the two tags (`gh api repos/<owner>/<repo>/compare/<old>...<new>`), add
# the new entry with what you read in `notes`, remove the old one, and keep the
# workflow's version comment equal to `version`. The auditor is the team; the commit
# says who did the work. `age_exempt = "<reason>"` adopts a release sooner than 72
# hours, for a security fix. See docs/internal/dependencies.md.

