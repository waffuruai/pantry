[[audit]]
action = "jdx/mise-action"
sha = "236a21c3b91f5db6d4e174b348674a0f0caac06d"
version = "v5.2.9"
who = "Waffuru AI, Inc. <security@waffuru.ai>"
date = 2026-11-21
notes = "Bump from v5.2.7 (b44d12e7), through v5.2.8. Compare b44d12e7...236a21c3, 9 commits; action.yml unchanged. src read in full: #732 adds src/file-move.ts, so the mise download's mkdtemp goes under RUNNER_TEMP when it exists (else os.tmpdir()) and moving mise, mise.exe or mise-shim.exe into place copies then unlinks on EXDEV; the move still runs after the download is verified, and the checksum, minisign and packslip verification paths are unchanged. package.json: packslip 1.11.2 to 1.11.3, whose npm gitHead is 44e50e5f, the packslip v1.11.3 tag already audited here; its code in dist/index.js is byte-identical. The dist/index.js diff (4757 lines) was read: those changes, the same 83 bundled packages (dist/licenses.txt, none added or removed) with bundler renames, and version moves: agent-base 7.1.4 to 9.0.0 with http-proxy-agent and https-proxy-agent 7 to 9.1.0, now one copy shared by the Azure pipeline and the npm fetch stack (CONNECT and Basic proxy auth as before; Negotiate only when opted in, loading kerberos, which is not bundled); @typespec/ts-http-runtime 0.3.10, @azure/core-client 1.11.2 and core-xml 1.6.1 (Expect: 100-continue, stream disposal, body headers dropped on redirect, defineProperty for deserialized keys); brace-expansion 5.0.13 (a step budget against slow expansion); glob 14.0.6, minipass-fetch 6.0.1 (brotli only when accepted), cacache 21.0.2. No new hosts, process or token use. The bundle was not rebuilt. The rest is workflow and tool bumps, the lock files and the changelog. v5.2.9 published 2026-11-15, tag is the pinned commit."

