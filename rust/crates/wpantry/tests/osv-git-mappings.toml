# Each catalog GIT mapping (`checks/machine/catalog.rs`, ("GIT", repo, tag format)) with
# one version and what OSV answered for its release tag, recorded 2026-11-17 with
#   POST https://api.osv.dev/v1/query {"package": {"ecosystem": "GIT", "name": <repo>}, "version": <tag>}
# counting every page. Read by `catalog_tests.rs`, offline.
#
# status:
#   answers     OSV named advisories for the tag (`answers` > 0, one of them in `example`).
#   empty       OSV answered nothing though `affected_by` names the version: the mapping is
#               broken for it, and an empty answer for this tool must not be read as clean.
#   unverified  OSV answered nothing and no CVE naming a version of the tool was found.
# A row's tag must be what the catalog's tag format makes of its version, so a changed
# format means re-recording the row. Re-record a row by hand with the request above.

[[mapping]]
tool = "node"
version = "18.0.0"
tag = "v18.0.0"
answers = 27
status = "answers"
example = "CVE-2022-32212"

# Broken: OSV's range for CVE-2024-24576 starts at 1.77.0 (1.77.0 answers 2), the record
# says every version before 1.77.2. Covered by the CVE-record check (OSV_FIRST).
[[mapping]]
tool = "rust"
version = "1.76.0"
tag = "1.76.0"
answers = 0
status = "empty"
affected_by = "CVE-2024-24576"

