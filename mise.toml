# Development toolchain, pinned, and the tasks that use it. `mise bootstrap` installs all of it
# (checksummed, through mise's aqua registry or against GitHub's release digest) and runs the `bootstrap` task; `mise run test` runs the
# suites; `mise tasks ls` lists the rest. CI installs the same pins with jdx/mise-action and runs the
# same tasks. Rust comes from rustup, at the toolchain rust/rust-toolchain.toml pins. wpantry itself
# needs only git and openssl, so this file is for contributors and CI, not users. Keep the
# pins equal to ops' mise.toml. See ops planning/specs/02-mise-bootstrap.md.
[tools]
node = "26.12.1"  # offline HTML viewer behavior tests (no npm dependencies)
python = "3.15.2"   # scripts/ and their tests
shellcheck = "0.11.0"
actionlint = "1.7.12"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1" # the coverage gate (mise run coverage)
# The third-party notices (mise run notices): not in aqua's registry, so mise's GitHub backend, which
# checks the release asset against its GitHub digest.
"github:EmbarkStudios/cargo-about" = "0.9.3"

# A global mise rust sets RUSTUP_TOOLCHAIN, which would win over rust/rust-toolchain.toml.
[tasks.build]
description = "Build wpantry (rust/target/release/wpantry) on the toolchain rust/rust-toolchain.toml pins"
dir = "rust"
run = "env -u RUSTUP_TOOLCHAIN cargo build --locked --release"

[tasks.bootstrap]
description = "Setup after mise installs [tools]: build wpantry and confirm it finds what it needs (wpantry tools)"
depends = ["build"]
run = "rust/target/release/wpantry tools"

[tasks.test]
description = "Test suites; `all` (the default) is the Rust tests, the install.sh test, the scripts/ tests, the HTML viewer tests and the Homebrew packaging tests"
usage = '''
arg "[suite]" default="all" help="all, rust, install, scripts, html or packaging" {
  choices "all" "rust" "install" "scripts" "html" "packaging"
}
'''
run = '''
cargo_test() { (cd rust && env -u RUSTUP_TOOLCHAIN cargo test --locked); }
scripts_test() { python3 -m unittest discover -s scripts; }
packaging_test() { tests/packaging/test-bump.sh && tests/packaging/test-tap-pr.sh; }
case "${usage_suite:-all}" in
  all) cargo_test && rust/release/test-install.sh && scripts_test && node rust/crates/wpantry/assets/report/test-viewer.cjs && packaging_test ;;
  html) node rust/crates/wpantry/assets/report/test-viewer.cjs ;;
  rust) cargo_test ;;
  install) exec rust/release/test-install.sh ;;
  scripts) scripts_test ;;
  packaging) packaging_test ;;
esac
'''

[tasks.coverage]
description = "Line coverage of the Rust tests, the contract suite's runs of the binary included (cargo-llvm-cov); fails under 90%. --html also writes rust/target/llvm-cov/html"
usage = '''
flag "--html" help="Also write the HTML report, to rust/target/llvm-cov/html"
'''
dir = "rust"
run = '''
set -e
# The global mise rust sets RUSTUP_TOOLCHAIN, which would win over rust-toolchain.toml;
# the pinned cargo-llvm-cov goes ahead of any `cargo install`ed one on PATH.
unset RUSTUP_TOOLCHAIN
PATH="$(mise where aqua:taiki-e/cargo-llvm-cov):$PATH"; export PATH
rustup component add llvm-tools
# One instrumented build (show-env): the contract and advisories suites
# (wpantry-cli's tests/) run the instrumented binary, which inherits
# LLVM_PROFILE_FILE, so the report counts the unit tests and those runs both.
eval "$(cargo llvm-cov show-env --sh)"
cargo llvm-cov clean --workspace
cargo test --locked --workspace --all-targets
if [ "${usage_html:-false}" = true ]; then cargo llvm-cov report --html; fi
cargo llvm-cov report --fail-under-lines 90
'''

[tasks.yara-diff]
description = "Scan a corpus with wpantry-yara and the reference yara 4.5.7 in one offline container, and fail on any match only one reports (needs docker)"
usage = '''
arg "<rules>" help="A YARA rules file"
arg "<corpus>" help="A directory, or volume:NAME for a Docker volume"
'''
run = 'scripts/yara-diff.sh "${usage_rules}" "${usage_corpus}"'

[tasks.yara-bench]
description = "Time and peak memory of loading a rules directory (default Pantry's): compiled from source, then read back from its compiled bundle"
usage = '''
arg "[rules]" help="A directory of .yar files (default ~/.cache/wpantry/rules)"
'''
run = 'scripts/yara-bench.sh ${usage_rules:-}'

[tasks.vet]
description = "Dependency audits; `all` (the default) is the actions record check (scripts/vet_actions.py) and cargo vet with cargo deny in rust/"
usage = '''
arg "[what]" default="all" help="all, actions or crates" {
  choices "all" "actions" "crates"
}
'''
run = '''
actions_vet() { python3 scripts/vet_actions.py; }
crates_vet() { (cd rust && env -u RUSTUP_TOOLCHAIN cargo vet --locked && env -u RUSTUP_TOOLCHAIN cargo deny --locked check); }
case "${usage_what:-all}" in
  all) actions_vet && crates_vet ;;
  actions) actions_vet ;;
  crates) crates_vet ;;
esac
'''

[tasks.notices]
description = "Regenerate the third-party notices wpantry embeds (rust/crates/wpantry-cli/THIRD-PARTY-NOTICES.txt) with cargo-about, after any dependency bump; --check fails when the committed file differs"
usage = '''
flag "--check" help="Generate into a temp file and fail when it differs from the committed one (CI)"
'''
dir = "rust"
run = '''
set -e
# The global mise rust sets RUSTUP_TOOLCHAIN, which would win over rust-toolchain.toml;
# the pinned cargo-about goes ahead of any `cargo install`ed one on PATH.
unset RUSTUP_TOOLCHAIN
PATH="$(mise where github:EmbarkStudios/cargo-about):$PATH"; export PATH
out=crates/wpantry-cli/THIRD-PARTY-NOTICES.txt
raw="$(mktemp)"; new="$(mktemp)"; log="$(mktemp)"; trap 'rm -f "$raw" "$new" "$log"' EXIT
# --frozen: the licence texts come from the crates' own packages, never from their repositories,
# so every machine renders the same file; cargo fetch puts the packages there.
cargo fetch --locked --quiet
cargo about generate --frozen --fail -c about.toml -m crates/wpantry-cli/Cargo.toml about.hbs > "$raw" 2> "$log" ||
  { cat "$log" >&2; exit 1; }
cat "$log" >&2
# A clarify entry whose files changed is only a warning to cargo-about, which then reads the crate
# as if there were none.
if grep -q "clarification" "$log"; then
  echo "error: a clarify entry in rust/about.toml no longer matches its crate: check the new files and update it" >&2
  exit 1
fi
# What the binary carries that isn't a crate, after the crates (about.hbs ends with its heading).
notice() { printf '\n==== %s\n\n' "$1"; cat "$2"; }
{
  notice "The Rust standard library (MIT or Apache-2.0; the MIT licence)" notices/rust-LICENSE-MIT
  notice "musl libc, in the Linux binaries (MIT)" notices/musl-COPYRIGHT
  notice "Popular npm package names: npm-high-impact (MIT)" notices/npm-high-impact-license
  notice "Secret rules: pantry-rules, translated from betterleaks (MIT)" crates/wpantry/assets/secrets/NOTICE
  notice "CVSS 4.0 scoring: FIRST's cvss-v4-calculator (BSD-2-Clause)" crates/wpantry/src/utils/cvss.NOTICE
  notice "HTML report fonts: Geist and Geist Mono (SIL Open Font License 1.1)" crates/wpantry/assets/report/fonts/LICENSE-Geist-OFL.txt
  notice "HTML report fonts: Instrument Serif (SIL Open Font License 1.1)" crates/wpantry/assets/report/fonts/LICENSE-InstrumentSerif-OFL.txt
} >> "$raw"
# Some crates ship CRLF licence files; the repository keeps LF (.gitattributes).
tr -d '\r' < "$raw" > "$new"
if [ "${usage_check:-false}" = true ]; then
  diff -u "$out" "$new" || { echo "error: $out is stale: run \`mise run notices\` and commit it" >&2; exit 1; }
else
  cat "$new" > "$out"
fi
'''

[tasks.contract]
description = "The CLI contract and advisory suites (rust/crates/wpantry-cli/tests) against the release binary; `mise run test rust` runs them against the debug one"
dir = "rust"
run = "env -u RUSTUP_TOOLCHAIN cargo test --locked --release -p wpantry-cli --test contract --test advisories"

[tasks.lint]
description = "bash -n and shellcheck -x on the shell scripts, actionlint on the workflows"
run = [
  'for f in rust/release/*.sh packaging/homebrew/*.sh tests/packaging/*.sh; do bash -n "$f"; done',
  "shellcheck -x rust/release/*.sh packaging/homebrew/*.sh tests/packaging/*.sh",
  "actionlint",
]

[tasks.scan]
description = "Run wpantry scan, built first, with the pinned tools; more flags after --, such as -- --json --no-input"
alias = "check"
usage = 'arg "[args]" var=#true help="wpantry scan flags"'
depends = ["build"]
run = '''
eval "set -- ${usage_args:-}"
exec rust/target/release/wpantry scan "$@"
'''
