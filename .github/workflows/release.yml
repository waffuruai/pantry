name: Release

# Reproducible, signed releases for every target; the playbook is
# docs/internal/release.md. A tag vX.Y.Z on main builds every target twice,
# from two checkouts at different paths, and requires byte-identical binaries;
# then it publishes them with SHA256SUMS, a GitHub artifact attestation and a
# cosign keyless bundle each, and publishes the crates to crates.io through
# trusted publishing (no long-lived token). A manual run is a dry run of a
# ref: the same checks and builds, the binaries kept as workflow artifacts,
# and nothing published.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to dry-run (nothing is published)"
        required: true
        default: dev

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REF: ${{ inputs.ref || github.ref }}

jobs:
  # The tag names the workspace version and sits on main; the crates package
  # and verify from their own sources.
  check:
    name: Check the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Tag, version and branch agree
        if: github.event_name == 'push'
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' rust/Cargo.toml | head -1)"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME but rust/Cargo.toml says $version"; exit 1; }
          # fetch-depth: 0 already fetched origin/main; a fetch here would need
          # the credentials persist-credentials: false dropped.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Install the pinned toolchain
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: cargo package
        working-directory: rust
        run: cargo package --workspace --locked

  build:
    name: Build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, rust: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, rust: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: universal-apple-darwin, rust: "aarch64-apple-darwin x86_64-apple-darwin" }
          # Windows (#11): repo checks only; the asset keeps its .exe so it runs
          # when downloaded. Git Bash runs build.sh.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, rust: x86_64-pc-windows-msvc, ext: .exe }
    env:
      TARGET: ${{ matrix.target }}
      RUST_TARGETS: ${{ matrix.rust }}
      ASSET: wpantry-${{ matrix.target }}${{ matrix.ext }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          path: one
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          path: two/elsewhere
          persist-credentials: false

      - name: musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools

      - name: Install the pinned toolchain and targets
        working-directory: one/rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          # shellcheck disable=SC2086 # RUST_TARGETS is a list
          rustup target add $RUST_TARGETS

      - name: Build twice
        run: |
          mkdir -p dist
          one/rust/release/build.sh "$TARGET" "dist/$ASSET"
          two/elsewhere/rust/release/build.sh "$TARGET" "second-build${{ matrix.ext }}"
          cmp "dist/$ASSET" "second-build${{ matrix.ext }}" || { echo "::error::two builds of one commit differ"; exit 1; }
          # macOS has shasum, Git Bash on Windows only sha256sum.
          if command -v sha256sum >/dev/null; then sha256sum "dist/$ASSET" "second-build${{ matrix.ext }}"; else shasum -a 256 "dist/$ASSET" "second-build${{ matrix.ext }}"; fi

      - name: Smoke test
        if: matrix.target != 'aarch64-unknown-linux-musl' || runner.arch == 'ARM64'
        run: |
          "dist/$ASSET" version --json
          "dist/$ASSET" tools --json > /dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wpantry-${{ matrix.target }}
          path: dist/${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Configure the environment with required reviewers: publishing waits for
    # a maintainer's approval (docs/internal/release.md).
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # attestations, cosign keyless signing, crates.io trusted publishing
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wpantry-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum wpantry-* > SHA256SUMS
          cat SHA256SUMS

      # The installer ships with the release it installs, attested like the
      # binaries: `releases/download/vX.Y.Z/install.sh` can't change later.
      # install.sh.sha256 beside it is what waffuru.ai's release receiver
      # checks before serving a pinned copy at waffuru.ai/pantry/install.sh;
      # without it that deploy fails.
      - name: install.sh
        run: |
          sed "s/^DEFAULT_VERSION=\"latest\"$/DEFAULT_VERSION=\"$GITHUB_REF_NAME\"/" install.sh > dist/install.sh
          grep -q "^DEFAULT_VERSION=\"$GITHUB_REF_NAME\"$" dist/install.sh
          chmod 0755 dist/install.sh
          (cd dist && sha256sum install.sh > install.sh.sha256 && cat install.sh.sha256)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/wpantry-*
            dist/install.sh

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: cosign keyless bundles
        working-directory: dist
        run: |
          for f in wpantry-*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      # Verify what is about to ship the way users will (docs/public/install.md).
      - name: Verify before publishing
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS install.sh.sha256
          for f in wpantry-*; do
            case "$f" in *.sigstore.json) continue ;; esac
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
            cosign verify-blob "$f" --bundle "$f.sigstore.json" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
          gh attestation verify install.sh --repo "$GITHUB_REPOSITORY"

      # Releases here are immutable: once published, no asset can be added. So
      # the release starts as a draft and the last job publishes it once the
      # packslip is attached. A rerun adds to the draft instead.
      - name: GitHub release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "wpantry $GITHUB_REF_NAME" --generate-notes ||
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      - name: Install the pinned toolchain
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install

      # crates.io trusted publishing can only be set up for a crate that
      # exists, so the first release publishes the crates by hand
      # (docs/internal/release.md) and this stays off until the repository
      # variable CRATES_IO_TRUSTED_PUBLISHING is "true".
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
        id: crates-io

      # The library first: the binary's crate depends on it at =x.y.z.
      - name: Publish to crates.io
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
        run: |
          # --no-verify: the check job already built the packaged crates;
          # building here would run dependency build scripts with this job's
          # OIDC token in reach.
          cargo publish --locked --no-verify -p wpantry
          cargo publish --locked --no-verify -p wpantry-cli

  # A signed packslip (https://packslip.dev) for the release: the binaries'
  # digests, platforms and executable name, signed keylessly with this
  # workflow's identity. mise installs from it (`mise use
  # packslip:github.com/waffuruai/pantry`) and verifies it, as does
  # `packslip verify`. Signed in a job that can't write the release, as
  # packslip recommends; the next job attaches the bundle and publishes.
  packslip:
    name: Packslip
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # keyless signing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wpantry-*
          path: dist
          merge-multiple: true

      - uses: jdx/packslip@7b32cd29a9240927882ee18b3db1dcfd8e0328b4 # v1.7.0
        id: packslip
        with:
          artifacts: >-
            dist/wpantry-x86_64-unknown-linux-musl
            dist/wpantry-aarch64-unknown-linux-musl
            dist/wpantry-universal-apple-darwin
            dist/wpantry-x86_64-pc-windows-msvc.exe
          bin: wpantry
          # The publish job attested the binaries; link those attestations.
          attest: link
          upload: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packslip
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  release:
    name: Attach the packslip and publish
    needs: packslip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release asset, and publishing the draft
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packslip
          path: packslip

      - name: Attach the packslip
        run: gh release upload "$GITHUB_REF_NAME" packslip/packslip.sigstore.json --clobber

      # Publishing makes the release immutable, so check nothing is missing:
      # the website's receiver needs install.sh.sha256, and mise the packslip.
      - name: Publish the release
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          for a in SHA256SUMS install.sh install.sh.sha256 packslip.sigstore.json \
            wpantry-x86_64-unknown-linux-musl wpantry-aarch64-unknown-linux-musl wpantry-universal-apple-darwin \
            wpantry-x86_64-pc-windows-msvc.exe; do
            printf '%s\n' "$assets" | grep -qx "$a" || { echo "::error::the draft has no $a"; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      # The website republishes install.sh at https://waffuru.ai/pantry/install.sh.
      # The release is out by now, so a failed dispatch only warns; the next
      # site deploy picks the release up anyway.
      - name: Tell the website about the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::WEBSITE_DISPATCH_TOKEN is unset; the website was not told about $GITHUB_REF_NAME."
            exit 0
          fi
          gh workflow run release.yml --repo waffuruai/website --ref main \
            -f product=pantry -f tag="$GITHUB_REF_NAME"
