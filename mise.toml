# Development toolchain, pinned, and the tasks that use it. `mise bootstrap` installs all of it
# (checksummed through mise's aqua registry) and runs the `bootstrap` task; `mise run test` runs the
# suites; `mise tasks ls` lists the rest. CI installs the same pins with jdx/mise-action and runs the
# same tasks. Rust comes from rustup, at the toolchain rust/rust-toolchain.toml pins. wpantry itself
# needs only gitleaks, git and openssl, so this file is for contributors and CI, not users. Keep the
# pins equal to ops' mise.toml. See ops planning/specs/02-mise-bootstrap.md.
[tools]
node = "26.12.1"  # offline HTML viewer behavior tests (no npm dependencies)
python = "3.15.1"   # the CLI contract suite, tests/contract
gitleaks = "8.30.1" # wpantry's secret scan
shellcheck = "0.11.0"
actionlint = "1.7.12"

# A global mise rust sets RUSTUP_TOOLCHAIN, which would win over rust/rust-toolchain.toml.
[tasks.build]
description = "Build wpantry (rust/target/release/wpantry) on the toolchain rust/rust-toolchain.toml pins"
dir = "rust"
run = "env -u RUSTUP_TOOLCHAIN cargo build --locked --release"

[tasks.bootstrap]
description = "Setup after mise installs [tools]: build wpantry and confirm it finds what it needs (wpantry tools)"
depends = ["build"]
run = "rust/target/release/wpantry tools"

[tasks.test]
description = "Test suites; `all` (the default) is the Rust tests, the CA trust test, the mitigation scripts' tests, the install.sh test and the HTML viewer tests"
usage = '''
arg "[suite]" default="all" help="all, rust, ca-trust, mitigations, install or html" {
  choices "all" "rust" "ca-trust" "mitigations" "install" "html"
}
'''
run = '''
cargo_test() { (cd rust && env -u RUSTUP_TOOLCHAIN cargo test --locked); }
mitigations_test() { local t; for t in mitigations/test-*.sh; do "$t" || return 1; done; }
case "${usage_suite:-all}" in
  all) cargo_test && ca-trust/test-ca-trust.sh && mitigations_test && tests/install/test-install.sh && node tests/html/test-viewer.cjs ;;
  html) node tests/html/test-viewer.cjs ;;
  rust) cargo_test ;;
  ca-trust) exec ca-trust/test-ca-trust.sh ;;
  mitigations) mitigations_test ;;
  install) exec tests/install/test-install.sh ;;
esac
'''

[tasks.contract]
description = "The CLI contract suite against WPANTRY (default rust/target/release/wpantry, built first)"
depends = ["build"]
env = { WPANTRY = "{{ env.WPANTRY | default(value='rust/target/release/wpantry') }}" }
run = "python3 -m unittest discover -s tests/contract"

[tasks.lint]
description = "bash -n and shellcheck -x on the shell scripts, actionlint on the workflows"
run = [
  'for f in ca-trust/*.sh mitigations/*.sh rust/release/*.sh install.sh tests/install/*.sh; do bash -n "$f"; done',
  # -x follows `source ca-common.sh`; .shellcheckrc resolves it relative to each script.
  "shellcheck -x ca-trust/*.sh mitigations/*.sh rust/release/*.sh install.sh tests/install/*.sh",
  "actionlint",
]

[tasks.check]
description = "Run wpantry check, built first, with the pinned tools; more flags after --, such as -- --json --no-input"
usage = 'arg "[args]" var=#true help="wpantry check flags"'
depends = ["build"]
run = '''
eval "set -- ${usage_args:-}"
exec rust/target/release/wpantry check "$@"
'''
