# wpantry's default gitleaks config (replace it with --gitleaks-config FILE).
# A repo's own .gitleaks.toml replaces this; its .gitleaksignore lists the
# fingerprints of reviewed false positives (gitleaks prints them).

[extend]
useDefault = true

[[allowlists]]
description = "Hashes, ids and names the generic rules mistake for keys"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^[0-9a-fA-F]{16,}$''',                                             # hex: hashes, git object ids, keys and ciphertexts in test vectors
  '''(?i)^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''', # UUIDs
  '''^[A-Z][A-Z0-9_]+$''',                                              # environment variable names
  '''^[a-z][a-z0-9]*([._/-][a-z0-9]+)+$''',                             # lowercase dotted / dashed / slashed identifiers
]

[[allowlists]]
description = "Known-answer tests and fixtures: keys there are published on purpose"
targetRules = ["generic-api-key"]
paths = [
  '''(?i)(^|/)(test[-_]?vectors?|testvectors|testdata|fixtures?|__fixtures__|kat|vectors|golden)(/|$)''',
  '''(?i)\.(rsp|kat|tv|vec)$''',
  '''(?i)(^|/)(cryptopp|supercop|wycheproof)/''',
]

[[allowlists]]
description = "Placeholders in docs and examples"
regexTarget = "secret"
regexes = [
  '''(?i)^(your|my|example|sample|dummy|fake|placeholder|changeme|xxx+)[-_a-z0-9]*$''',
  '''^<[^>]+>$''',
  '''^\$\{?[A-Za-z_][A-Za-z0-9_]*\}?$''',
]
