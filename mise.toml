# Development toolchain, pinned. `mise install` fetches all of it (checksummed
# through mise's aqua registry); `mise exec -- wscanner` runs with it on PATH.
# The scanner itself only needs the Python 3.9+ a fresh Mac ships, so this file
# is for contributors and CI, not users. Keep the pins equal to ops' Makefile.
[tools]
python = "3.15.1"
osv-scanner = "2.7.0"
gitleaks = "8.30.1"
shellcheck = "0.11.0"
actionlint = "1.7.12"
